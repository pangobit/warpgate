version: "1"
project: brighter-platform

# Cluster nodes - can be single or multiple
# Any node can run the control plane
nodes:
  - id: node-1
    host: 10.0.0.1
    tailscale_ip: 100.100.100.1
    roles: [control-plane, worker]
    labels:
      region: us-east
      
  - id: node-2
    host: 10.0.0.2
    tailscale_ip: 100.100.100.2
    roles: [worker]
    labels:
      region: us-west

# Networking configuration
networking:
  # Tailscale tailnet for private networking
  tailnet: brighter.ts.net
  
  # DNS management via Cloudflare
  dns:
    provider: cloudflare
    zone: brighter.io
    # api_token: ${CLOUDFLARE_API_TOKEN}  # Reference SecretSauce
  
  # Traefik reverse proxy configuration
  traefik:
    entry_points: [web, websecure]
    acme:
      enabled: true
      email: admin@brighter.io
      provider: letsencrypt
      staging: false

# Container registry settings
registry:
  server: ghcr.io
  # username: ${REGISTRY_USERNAME}
  # password: ${REGISTRY_PASSWORD}

# Go module proxy for private packages (on tailnet)
go_proxy: https://goproxy.brighter.ts.net

# Secrets provider (SecretSauce)
secrets:
  provider: secretsauce
  config:
    endpoint: https://secretsauce.internal
    token: ${SECRETSAUCE_TOKEN}

# Applications to deploy
apps:
  # Auth service with Litestream replication
  - name: auth-service
    image: ghcr.io/pangobit/auth-service
    version: v2.1.0
    replicas: 1
    targets: [node-1]  # Run on specific node
    domains:
      - auth.brighter.io
    ports:
      - container: 8080
    env:
      LOG_LEVEL: info
      ENVIRONMENT: production
    secrets:
      - DATABASE_URL
      - JWT_SECRET
      - LITESTREAM_URL
    health_check:
      path: /health
      port: 8080
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - name: auth-data
        path: /data
        backup: true
    sidecars:
      - name: litestream
        image: litestream/litestream:0.5.6
        volumes: [auth-data:/data]
        env:
          LITESTREAM_URL: ${LITESTREAM_URL}
    init:
      - name: litestream-restore
        image: litestream/litestream:0.5.6
        command: "litestream restore /data/auth.db"
        volumes: [auth-data:/data]
        env:
          LITESTREAM_URL: ${LITESTREAM_URL}
    resources:
      cpus: "0.5"
      memory: "512M"
      cpu_limit: "1.0"
      memory_limit: "1G"

  # Platform API - can run on multiple nodes
  - name: platform-api
    image: ghcr.io/pangobit/platform-api
    version: v3.2.1
    replicas: 2
    targets: [all]  # Run on all nodes
    domains:
      - api.brighter.io
    ports:
      - container: 3000
    env:
      LOG_LEVEL: info
      ENVIRONMENT: production
    secrets:
      - DATABASE_URL
      - REDIS_URL
      - AUTH_SERVICE_URL
    health_check:
      path: /api/health
      port: 3000
      interval: 15s
    resources:
      cpus: "1.0"
      memory: "1G"

  # Frontend site
  - name: site-frontend
    image: ghcr.io/pangobit/brighter-site
    version: latest
    replicas: 1
    targets: [all]
    domains:
      - www.brighter.io
      - brighter.io
    ports:
      - container: 3000
    env:
      NODE_ENV: production
    secrets:
      - API_BASE_URL
    resources:
      cpus: "0.25"
      memory: "256M"

  # Admin dashboard
  - name: admin-dashboard
    image: ghcr.io/pangobit/admin-dashboard
    version: v1.5.0
    replicas: 1
    targets: [node-1]
    domains:
      - admin.brighter.io
    ports:
      - container: 3000
    env:
      NODE_ENV: production
    secrets:
      - API_BASE_URL
      - AUTH_SERVICE_URL
