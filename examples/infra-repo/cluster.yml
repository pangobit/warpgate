version: "2"
project: myapp

nodes:
  - id: node-1
    host: 10.0.0.1
    private_ip: 100.x.x.x

networking:
  private_network: my-network.ts.net
  dns:
    provider: cloudflare
    zone: example.com
    api_token: ${CF_DNS_API_TOKEN}
  traefik:
    entry_points: [web, websecure]
    acme:
      enabled: true
      email: admin@example.com
      provider: letsencrypt
      challenge: dns

registry:
  server: ghcr.io
  # username and password are optional here — if provided during bootstrap,
  # they are stored in SecretSauce and used automatically by deploy.
  # username: ${REGISTRY_USERNAME}
  # password: ${REGISTRY_TOKEN}
