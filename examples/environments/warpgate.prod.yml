version: "1"
project: brighter-platform

# Production Environment Configuration
# Usage: warpgate -c warpgate.prod.yml deploy auth-service

nodes:
  - id: prod-node-1
    host: 10.0.0.1
    tailscale_ip: 100.100.100.1
    roles: [control-plane, worker]
    labels:
      region: us-east
      
  - id: prod-node-2
    host: 10.0.0.2
    tailscale_ip: 100.100.100.2
    roles: [worker]
    labels:
      region: us-west

networking:
  tailnet: brighter.ts.net
  dns:
    provider: cloudflare
    zone: brighter.io
  traefik:
    entry_points: [web, websecure]
    acme:
      enabled: true
      email: admin@brighter.io
      provider: letsencrypt
      staging: false  # Production certs only

registry:
  server: ghcr.io
  username: ${REGISTRY_USERNAME}
  password: ${REGISTRY_TOKEN}

go_proxy: https://goproxy.brighter.ts.net

secrets:
  provider: secretsauce
  config:
    endpoint: https://secretsauce.brighter.io
    token: ${SECRETSAUCE_TOKEN}

apps:
  - name: auth-service
    image: ghcr.io/pangobit/auth-service
    version: ${AUTH_VERSION:-v2.1.0}  # Default to v2.1.0 if not set
    replicas: 2
    targets: [prod-node-1, prod-node-2]
    domains:
      - auth.brighter.io
    ports:
      - container: 8080
    env:
      LOG_LEVEL: info
      ENVIRONMENT: production
    secrets:
      - DATABASE_URL
      - JWT_SECRET
      - LITESTREAM_URL
    sidecars:
      - name: litestream
        image: litestream/litestream:0.5.6
        volumes: [auth-data:/data]
        env:
          LITESTREAM_URL: ${LITESTREAM_URL}
    init:
      - name: litestream-restore
        image: litestream/litestream:0.5.6
        command: "litestream restore /data/auth.db"
        volumes: [auth-data:/data]
        env:
          LITESTREAM_URL: ${LITESTREAM_URL}
