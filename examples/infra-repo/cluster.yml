version: "2"
project: myapp

nodes:
  - id: node-1
    host: 10.0.0.1
    tailscale_ip: 100.x.x.x

networking:
  tailnet: my-tailnet.ts.net
  dns:
    provider: cloudflare
    zone: example.com
  traefik:
    entry_points: [web, websecure]
    acme:
      enabled: true
      email: admin@example.com
      provider: letsencrypt

registry:
  server: ghcr.io
  username: ${REGISTRY_USERNAME}
  password: ${REGISTRY_TOKEN}
