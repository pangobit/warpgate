version: "1"
project: brighter-platform

# Development Environment Configuration
# Usage: warpgate -c warpgate.dev.yml status

nodes:
  - id: dev-node
    host: 10.0.0.10
    tailscale_ip: 100.100.100.10
    roles: [control-plane, worker]

networking:
  tailnet: brighter-dev.ts.net
  dns:
    provider: cloudflare
    zone: brighter.dev
  traefik:
    entry_points: [web, websecure]
    acme:
      enabled: true
      email: dev@brighter.io
      provider: letsencrypt
      staging: true  # Use staging certs for dev

registry:
  server: ghcr.io
  # Credentials loaded from environment variables
  username: ${REGISTRY_USERNAME}
  password: ${REGISTRY_TOKEN}

secrets:
  provider: env  # Use environment variables for secrets in dev

apps:
  - name: auth-service
    image: ghcr.io/pangobit/auth-service
    version: latest  # Use latest in dev
    replicas: 1
    targets: [dev-node]
    domains:
      - auth.brighter.dev
    ports:
      - container: 8080
    env:
      LOG_LEVEL: debug
      ENVIRONMENT: development
    secrets:
      - DATABASE_URL
      - JWT_SECRET
