kind: warpgate/app
targets: [node-1]
release:
  services:
    example-app:
      image: ghcr.io/org/example-app
      image_tag: v1.0.0
      secrets_prefix: example-app/prod
      port: 8080
      environment:
        LOG_LEVEL: info
      expose:
        public:
          domains: [app.example.com]
        private:
          port: 8080
